name: Build public SafeRide release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already set in version.py, for example 3.5.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Check release version
        shell: pwsh
        run: .\tools\assert-release-version.ps1 -Version "${{ inputs.version }}"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build and verify Windows packages
        shell: pwsh
        run: |
          .\tools\build.ps1 -Target All
          .\tools\build-installer.ps1 -SkipAppBuild
          .\tools\build-portable.ps1 -SkipAppBuild
          .\tools\verify-portable.ps1

      - name: Restore Android signing key
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:ANDROID_KEYSTORE_BASE64) { throw "ANDROID_KEYSTORE_BASE64 is not configured" }
          $keyPath = Join-Path $env:RUNNER_TEMP "saferide-release.jks"
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          "ANDROID_KEYSTORE_PATH=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and verify signed Android APK
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: .\tools\build-android.ps1 -Variant Release -AndroidSdk $env:ANDROID_HOME -JavaHome $env:JAVA_HOME

      - name: Publish public GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ inputs.version }}"
          .\release\SafeRide-Setup-x64.exe
          .\release\SafeRide-Setup-x64.sha256.txt
          .\release\SafeRide-Portable-x64.exe
          .\release\SafeRide-Portable-x64.sha256.txt
          .\release\SafeRide-Android.apk
          .\release\SafeRide-Android.sha256.txt
          --target "${{ github.sha }}"
          --title "SafeRide ${{ inputs.version }}"
          --generate-notes
